name: Deploy to GitHub Pages and Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: ./node_modules/.bin/cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon > ../build.log 2>&1 || {
            git config user.name "github-actions"
            grep -A 30 -i "what went wrong" ../build.log > ../build-error.txt || tail -n 200 ../build.log > ../build-error.txt
            cd ..
            git add build-error.txt
            git commit -m "diagnostics: build error log"
            git push origin main || true
            exit 1
          }
          cat ../build.log | tail -n 30

      - name: Copy APK to Web Distribution
        run: |
          APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" dist/PhotoRoulette.apk
          mkdir -p public
          cp "$APK_FILE" public/PhotoRoulette.apk
          ls -la dist/PhotoRoulette.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRoulette-APK
          path: dist/PhotoRoulette.apk
          retention-days: 30
